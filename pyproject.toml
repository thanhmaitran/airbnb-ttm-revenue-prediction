[project]
name = "airbnb-revenue-prediction"
version = "1.0.0"
description = "A leak-free, config-driven ML pipeline predicting Airbnb trailing-twelve-month (TTM) revenue, with a PySpark big-data track."
authors = [{ name = "Thanh Mai Tran" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.black]
line-length = 110
target-version = ["py311"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
